<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Contador de Términos 💔</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #111;
      color: #fff;
    }

    h2 {
      font-size: 50px;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      margin: 10px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
    }

    .disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .add { background: #28a745; color: white; }
    .remove { background: #ffc107; color: black; }
    .reset { background: #dc3545; color: white; }

    .admin-btn {
      background: #444;
      color: white;
      font-size: 12px;
      padding: 5px 10px;
    }
  </style>
</head>
<body>

  <h1>💔 Contador de Términos do Relacionamento da Ananda</h1>
  <h2 id="contador">0</h2>

  <div id="controles" class="disabled">
    <button class="add" onclick="mais()">➕ +1</button>
    <button class="remove" onclick="menos()">➖ -1</button>
    <button class="reset" onclick="resetar()">🔄 Reset</button>
  </div>

  <button class="admin-btn" onclick="login()">🔐 Admin</button>

  <canvas id="grafico"></canvas>

  <audio id="som">
    <source src="https://www.myinstants.com/media/sounds/game-over.mp3" type="audio/mpeg">
  </audio>

<script>
  const SENHA = "speeddash10.";

  let admin = false;
  let total = parseInt(localStorage.getItem("terminos")) || 0;
  let historico = JSON.parse(localStorage.getItem("historico")) || [];

  const contador = document.getElementById("contador");
  const som = document.getElementById("som");
  const controles = document.getElementById("controles");

  contador.innerText = total;

  const ctx = document.getElementById("grafico").getContext("2d");

  const grafico = new Chart(ctx, {
    type: "line",
    data: {
      labels: historico.map((_, i) => "Término " + (i+1)),
      datasets: [{
        label: "Histórico",
        data: historico,
        borderWidth: 2,
        fill: false
      }]
    }
  });

  function login() {
    const senha = prompt("Digite a senha:");

    if (senha === SENHA) {
      admin = true;
      controles.classList.remove("disabled");
      alert("Modo admin ativado 😈");
    } else {
      alert("Senha errada!");
    }
  }

  function mais() {
    if (!admin) return;

    total++;
    historico.push(total);
    som.currentTime = 0;
    som.play();

    salvar();
    atualizar();
  }

  function menos() {
    if (!admin) return;

    if (total > 0) {
      total--;
      historico.push(total);
      salvar();
      atualizar();
    }
  }

  function resetar() {
    if (!admin) return;

    if (confirm("Resetar tudo?")) {
      total = 0;
      historico = [];
      salvar();
      atualizar();
    }
  }

  function salvar() {
    localStorage.setItem("terminos", total);
    localStorage.setItem("historico", JSON.stringify(historico));
  }

  function atualizar() {
    contador.innerText = total;

    grafico.data.labels = historico.map((_, i) => "Término " + (i+1));
    grafico.data.datasets[0].data = historico;
    grafico.update();
  }
</script>

</body>
</html>
